name: Testes Automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Criar .env para a pipeline
        run: |
          echo "PORT=3000" >> .env
          echo "MONGODB_URI=mongodb://127.0.0.1:27017/gestao-de-alunos" >> .env
          echo "BASE_URL=http://localhost:3000" >> .env

      - name: Subir a API em segundo plano
        run: npm start &

      - name: Aguardar a API responder
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Rodar os testes automatizados
        run: npm test